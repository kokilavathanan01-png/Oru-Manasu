<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ஒரே மனசு</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column like a shared notebook page. A heart split into two halves (you = turmeric, partner = teal) is the only motif; the halves join when both answers match. */
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --ink:#16302F; --muted:#556E6C; --line:#D3DED8;
  --you:#D98E04; --you-soft:#FBEED0; --them:#0E7C7B; --them-soft:#D3EEEB;
  --match:#C2203F; --match-soft:#F8DCE2; --focus:#0E7C7B;
  --f-display:'Baloo Thambi 2','Noto Sans Tamil','Latha',system-ui,sans-serif;
  --f-body:'Hind Madurai','Noto Sans Tamil','Latha',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1B; --surface:#162526; --ink:#E7F0EE; --muted:#9BB3B0; --line:#294342;
    --you:#F2B233; --you-soft:#3A2D0E; --them:#3FC1BC; --them-soft:#0F3836;
    --match:#F0607C; --match-soft:#3A1520; --focus:#3FC1BC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1B; --surface:#162526; --ink:#E7F0EE; --muted:#9BB3B0; --line:#294342;
  --you:#F2B233; --you-soft:#3A2D0E; --them:#3FC1BC; --them-soft:#0F3836;
  --match:#F0607C; --match-soft:#3A1520; --focus:#3FC1BC;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 17px/1.65 var(--f-body);
  padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--f-display);font-weight:700;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:34px}
h2{font-size:23px}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.fine{color:var(--muted);font-size:15px}
.center{text-align:center}
.note{padding:40px 0;color:var(--muted)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font:700 22px/1.2 var(--f-display)}
.chip{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;min-height:38px;cursor:pointer;font-size:15px}
.chip:hover{border-color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{gap:8px;padding-block:22px}
.eyebrow{font-size:14px;letter-spacing:.04em;color:var(--muted)}
.stack{gap:14px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
input{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:50px;width:100%;min-width:0}
input:focus{border-color:var(--them);outline:none;box-shadow:0 0 0 3px var(--them-soft)}
.row{display:flex;gap:10px;align-items:stretch}
.row input{flex:1}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.primary{background:var(--ink);color:var(--bg);border:0;border-radius:14px;min-height:54px;padding:10px 20px;font:700 18px/1.3 var(--f-display);cursor:pointer;width:100%}
.primary:hover:not(:disabled){opacity:.9}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;min-height:46px;padding:8px 16px;cursor:pointer;font-weight:600}
.ghost:hover{border-color:var(--muted)}
.wide{width:100%}

.heart{width:112px;height:auto;display:block;margin:0 auto;overflow:visible}
.heart .hl,.heart .hr{transform-box:view-box;transform-origin:60px 102px;transition:transform .8s cubic-bezier(.25,1.35,.5,1)}
.heart .hl{fill:var(--you)}
.heart .hr{fill:var(--them)}
.heart.mini{width:30px}
.heart.mini .hl,.heart.mini .hr{transition:none}
.heart.pre .hl{transform:translate(-26px,0)}
.heart.pre .hr{transform:translate(26px,0)}
.heart.apart .hl{transform:translate(-10px,3px) rotate(-9deg)}
.heart.apart .hr{transform:translate(10px,3px) rotate(9deg)}
.heart.joined .hl,.heart.joined .hr{transform:none}

.codebox{font:800 42px/1.2 var(--f-display);letter-spacing:.22em;text-align:center;padding:12px 8px 12px calc(8px + .22em);border:2px dashed var(--line);border-radius:14px;user-select:all;overflow-wrap:anywhere}

.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px}
.pname{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.pname small{font-weight:400;color:var(--muted)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.dot.you{background:var(--you)}
.dot.them{background:var(--them)}
.dot.hollow{background:transparent;border:2px dashed var(--them)}
.prow.wait{color:var(--muted)}
.pill{font-size:14px;padding:2px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--them);background:var(--them-soft);color:var(--ink)}

.score{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
.score small{display:block;font-size:14px;color:var(--muted);line-height:1.3}
.score b{font:700 28px/1.2 var(--f-display)}
.score b span{font-size:18px;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:58%}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.35}
.dots i.m{background:var(--match);opacity:1}

.qcard h2{font-size:24px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:56px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--you)}
.opt .badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font:700 16px/1 var(--f-display)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--you);background:var(--you-soft)}
.opt[aria-pressed="true"] .badge{background:var(--you);border-color:var(--you);color:#201600}
.opt:disabled{cursor:default}
.opt:disabled:not([aria-pressed="true"]){opacity:.5}
.hint{color:var(--muted);font-size:15px}

.wait3{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.wait3 i{width:7px;height:7px;border-radius:50%;background:var(--them);animation:blink 1.2s infinite ease-in-out}
.wait3 i:nth-child(2){animation-delay:.2s}
.wait3 i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.reveal{display:flex;flex-direction:column;gap:14px;align-items:stretch;padding-top:4px}
.verdict{font:700 22px/1.4 var(--f-display);text-align:center;text-wrap:balance}
.verdict.match{color:var(--match)}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.ans.you{border-color:var(--you)}
.ans.them{border-color:var(--them)}
.ans .dot{margin-top:9px}
.ans small{display:block;color:var(--muted);font-size:14px;line-height:1.4}
.ans div{min-width:0;overflow-wrap:anywhere;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,460px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  h1{font-size:30px}
  .codebox{font-size:34px}
  .row{flex-direction:column}
  .dots{max-width:48%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

a.ghost{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:inherit;flex:1}
.row>.ghost{flex:1}
.banner{margin:0;padding:8px 14px;border-radius:12px;background:var(--match-soft);color:var(--ink);font-size:15px;text-align:center}
button.chip{display:inline-block;vertical-align:baseline;min-height:34px}
</style>

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var orderCache={};
function orderFor(seed,cycle){
  var k=seed+':'+cycle;
  if(orderCache[k]) return orderCache[k];
  var r=rng(seed+cycle*104729), a=[], i, j, t;
  for(i=0;i<Q.length;i++) a.push(i);
  for(i=a.length-1;i>0;i--){ j=Math.floor(r()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  orderCache[k]=a; return a;
}
function questionAt(n,seed){
  var N=Q.length;
  return Q[orderFor(seed,Math.floor(n/N))[n%N]];
}

    '<div class="field"><label for="nick">உங்கள் பெயர்</label><input id="nick" maxlength="20" autocomplete="nickname" value="'+esc(nick)+'" placeholder="துணை உங்களை எப்படி அழைப்பார்?"></div>'+
    (hashCode?'':'<button class="primary" data-act="create">புதிய அறை உருவாக்கு</button>')+
    (last&&last.code&&!hashCode?'<button class="ghost wide" data-act="resume">முந்தைய அறையைத் தொடர் ('+esc(last.code)+')</button>':'')+
    (hashCode?'':'<div class="or"><span>அல்லது</span></div>')+
    '<div class="field"><label for="jcode">'+(hashCode?'துணை அனுப்பிய அறை குறியீடு':'துணை கொடுத்த குறியீடு')+'</label><div class="row"><input id="jcode" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="எ.கா. K7M2QX" value="'+esc(hashCode)+'"><button class="ghost" data-act="join">அறையில் சேர்</button></div></div>'+
    (hashCode?'<button class="ghost wide" data-act="clearhash">நான் புதிய அறை உருவாக்க வேண்டும்</button>':'')+
  '</section>':'')+
  setup+
  '<p class="fine center">'+Q.length+' கேள்விகள் உள்ளன. தீர்ந்ததும் புதிய வரிசையில் மீண்டும் தொடங்கும். இருவரும் ஒரே பதிலைத் தேர்ந்தால் இதயம் ஒன்று சேரும்.</p>';
}
function netBanner(){
  if(!netOk) return '<p class="banner">இணைய இணைப்பு இல்லை. மீண்டும் இணைக்கிறோம்…</p>';
  var ot=other(), o=doc&&doc.players&&doc.players[ot];
  if(o&&!isOn(ot)) return '<p class="banner">'+esc(o.name||'துணை')+' இப்போது இணைப்பில் இல்லை. திரும்பி வரும்வரை காத்திருக்கிறோம்.</p>';
  return '';
}
function lobby(){
  var P=doc.players||{}, mine=P[role]||{}, their=P[other()];
  function row(cls,name,tag,ready){
    return '<li class="prow"><span class="dot '+cls+'"></span><span class="pname">'+esc(name)+(tag?' <small>'+tag+'</small>':'')+'</span><span class="pill'+(ready?' ok':'')+'">'+(ready?'தயார்':'இன்னும் இல்லை')+'</span></li>';
  }
  var wa='https://wa.me/?text='+encodeURIComponent('ஒரே மனசு விளையாடலாம் வா! 💕\n'+inviteLink()+'\nஅறை குறியீடு: '+code);
  var invite=role==='h'?
    '<section class="card center"><p class="eyebrow">உங்கள் அறை குறியீடு</p><div class="codebox" id="codebox">'+esc(code)+'</div>'+
      '<div class="row"><button class="ghost" data-act="copylink">இணைப்பை நகலெடு</button><a class="ghost" href="'+wa+'" target="_blank" rel="noopener">WhatsApp-ல் அனுப்பு</a></div>'+
      '<p class="muted">இணைப்பை அனுப்பினால் துணை திறந்ததும் குறியீடும் தரவு அமைப்பும் தானாக நிரம்பும். அவர்கள் பெயர் மட்டும் உள்ளிட்டு “அறையில் சேர்” தொட்டால் போதும்.</p>'+
      '<button class="ghost wide" data-act="copy">குறியீடு மட்டும் நகலெடு</button></section>':
    '<section class="card center"><p class="eyebrow">அறை குறியீடு</p><div class="codebox" id="codebox">'+esc(code)+'</div></section>';
  return bar()+netBanner()+invite+
  '<section class="card"><ul class="plist">'+
    row('you',mine.name||'நீங்கள்','(நீங்கள்)',mine.ready)+
    (their?row('them',their.name||'துணை','',their.ready):'<li class="prow wait"><span class="dot them hollow"></span><span class="pname">துணைக்காகக் காத்திருக்கிறோம்…</span></li>')+
  '</ul></section>'+
  '<button class="primary" data-act="ready"'+(their?'':' disabled')+'>'+(mine.ready?'தயார் நிலையை நீக்கு':'நான் தயார்')+'</button>'+
  '<p class="fine center">'+(their?'இருவரும் “தயார்” என்றதும் ஆட்டம் தானாகத் தொடங்கும்.':'துணை சேர்ந்த பிறகு “நான் தயார்” பொத்தான் இயங்கும்.')+'</p>';
}
function game(){
  var P=doc.players||{}, ot=other(), pname=(P[ot]&&P[ot].name)||'துணை';
  var qn=doc.qNo||0, qd=questionAt(qn,doc.seed|0), text=qd[1], opts=qd[2];
  var A=doc.ans||{}, ma=A[role], ta=A[ot];
  var mine=(ma&&ma.q===qn)?ma.c:null, theirs=(ta&&ta.q===qn)?ta.c:null;
  var nx=doc.nx||{}, iNext=nx[role]===qn, theyNext=nx[ot]===qn;
  var played=doc.played||0, matches=doc.matches||0;
  var dots=(doc.hist||'').split('').filter(Boolean).map(function(ch){return '<i class="'+(ch==='1'?'m':'')+'"></i>';}).join('');
  var score='<section class="card score"><div><small>பொருத்தம்</small><b>'+(played?matches+'<span> / '+played+'</span>':'—')+'</b></div><div class="dots" aria-hidden="true">'+dots+'</div></section>';
  var head='<p class="eyebrow">'+esc(CAT[qd[0]])+' · கேள்வி '+(qn+1)+'</p><h2>'+esc(text)+'</h2>';
  var body='';
  if(mine!==null && theirs!==null){
    var match=mine===theirs;
    var cls=match?(animQ===qn?'joined':'pre'):'apart';
    var verdict=(match?V_OK:V_NO)[qn%3];
    body='<div class="reveal">'+heart(cls,match?'இதயம் ஒன்று சேர்ந்தது':'இதயம் இரண்டாகப் பிரிந்தது')+
      '<p class="verdict'+(match?' match':'')+'">'+verdict+'</p>'+
      '<div class="answers">'+
        '<div class="ans you"><span class="dot you"></span><div><small>நீங்கள்</small>'+esc(opts[mine]||'')+'</div></div>'+
        '<div class="ans them"><span class="dot them"></span><div><small>'+esc(pname)+'</small>'+esc(opts[theirs]||'')+'</div></div>'+
      '</div></div>'+
      '<button class="primary" data-act="next"'+(iNext?' disabled':'')+'>'+(iNext?esc(pname)+' தயாராகக் காத்திருக்கிறோம்…':'அடுத்த கேள்வி')+'</button>'+
      (theyNext&&!iNext?'<p class="hint center">'+esc(pname)+' அடுத்த கேள்விக்குத் தயார்.</p>':'');
  } else {
    var locked=mine!==null;
    var sel=locked?mine:(pickQ===qn?pick:null);
    body='<div class="opts" role="group" aria-label="பதில்கள்">'+opts.map(function(o,i){
      return '<button class="opt" data-act="opt" data-i="'+i+'" aria-pressed="'+(sel===i)+'"'+(locked?' disabled':'')+'><span class="badge">'+LET[i]+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
    if(locked){
      body+='<p class="hint">உங்கள் பதில் பதிவாகிவிட்டது. '+esc(pname)+' தேர்வு செய்யக் காத்திருக்கிறோம்<span class="wait3"><i></i><i></i><i></i></span></p>';
    } else {
      body+='<p class="hint">'+(theirs!==null?esc(pname)+' தேர்வு செய்துவிட்டார். உங்கள் முறை!':'ஒரு பதிலைத் தேர்ந்தெடுத்து உறுதிசெய்யுங்கள்.')+'</p>'+
        '<button class="primary" data-act="confirm"'+(sel===null?' disabled':'')+'>பதிலை உறுதிசெய்</button>';
    }
  }
  return bar()+netBanner()+score+'<section class="card qcard">'+head+body+'</section>';
}
var lastHtml='';
function render(){
  if(screen!=='room') return;
  var h;
  if(!doc) h=bar()+'<p class="note center">அறையை ஏற்றுகிறோம்…</p>';
  else h=doc.phase==='playing'?game():lobby();
  if(h===lastHtml) return;
  lastHtml=h; app.innerHTML=h;
  var hp=app.querySelector('.heart.pre');
  if(hp&&doc){
    animQ=doc.qNo||0;
    requestAnimationFrame(function(){requestAnimationFrame(function(){hp.classList.remove('pre');hp.classList.add('joined');});});
  }
}

/* ---------- எழுதுதல், படித்தல் ---------- */
async function write(patch){
  if(!code) return false;
  writeSeq++; pending++;
  if(doc){ Object.keys(patch).forEach(function(k){ var v=patch[k]; if(v&&typeof v==='object'&&v['.sv']) return; setPath(doc,k,JSON.parse(JSON.stringify(v))); }); render(); }
  try{ await dreq('PATCH','rooms/'+code,patch); netOk=true; failCount=0; return true; }
  catch(e){ toast(errText(e)); netOk=false; return false; }
  finally{ pending--; writeSeq++; }
}
function normalize(d){
  d.players=d.players||{}; d.ans=d.ans||{}; d.nx=d.nx||{}; d.seen=d.seen||{};
  d.qNo=d.qNo|0; d.played=d.played|0; d.matches=d.matches|0; d.hist=d.hist||'';
  return d;
}
function afterDoc(){
  var S=doc,P=S.players;
  if(S.phase==='lobby'){
    if(P.h&&P.g&&P.h.ready&&P.g.ready){ if(!startSent){ startSent=true; write({phase:'playing'}); } }
    else startSent=false;
  } else if(S.phase==='playing'){
    var q=S.qNo;
    if(P.h&&P.g&&S.nx.h===q&&S.nx.g===q&&advSent!==q){
      advSent=q;
      var a=S.ans.h,b=S.ans.g, m=!!(a&&b&&a.q===q&&b.q===q&&a.c===b.c);
      write({qNo:q+1,played:S.played+1,matches:S.matches+(m?1:0),hist:(S.hist+(m?'1':'0')).slice(-24)});
    }
  }
  render();
}
async function pollOnce(){
  if(screen!=='room'||!code) return;
  var s=writeSeq, c=code, was=netOk;
  try{
    var d=await dreq('GET','rooms/'+c);
    if(c!==code||screen!=='room') return;
    failCount=0; netOk=true;
    if(s!==writeSeq||pending>0){ if(was!==netOk) render(); return; }
    if(d===null){ if(doc){ toast('இந்த அறை நீக்கப்பட்டுள்ளது.'); goHome(); } return; }
    doc=normalize(d); afterDoc();
  } catch(e){
    failCount++; if(failCount>=2) netOk=false;
    if(was!==netOk) render();
  }
}
function startPolling(){
  var my=++pollToken;
  (async function loop(){
    while(my===pollToken){
      await pollOnce();
      if(my!==pollToken) break;
      if(++beat%5===1&&code&&role){ var p={}; p['seen/'+role]={'.sv':'timestamp'}; dreq('PATCH','rooms/'+code,p).catch(function(){}); }
      await new Promise(function(r){setTimeout(r,document.hidden?5000:1200);});
    }
  })();
}
function enterRoom(r,c,d){
  role=r; code=c; doc=normalize(d); screen='room'; pick=null; pickQ=-1; animQ=-1; advSent=-1; startSent=false; lastHtml=''; netOk=true; failCount=0; beat=0; joinedAt=Date.now();
  ls('set',K_LAST,JSON.stringify({role:r,code:c}));
  keepAwake(); render(); startPolling();
}
function goHome(){ pollToken++; code=''; doc=null; role=null; pick=null; pickQ=-1; lastHtml=''; renderHome(); }

/* ---------- அறை உருவாக்குதல், சேர்தல் ---------- */
async function createRoom(){
  var name=readNick(); if(!name){toast('முதலில் உங்கள் பெயரை உள்ளிடுங்கள்.');return;}
  if(busy) return; busy=true; myName=name;
  try{
    for(var i=0;i<6;i++){
      var c=genCode(), ex=await dreq('GET','rooms/'+c);
      if(ex!==null) continue;
      var d={seed:Math.floor(Math.random()*2147483000)+1,phase:'lobby',qNo:0,played:0,matches:0,hist:'',players:{h:{name:name,ready:false}}};
      await dreq('PUT','rooms/'+c,d);
      var fresh=await dreq('GET','rooms/'+c);
      enterRoom('h',c,fresh||d); return;
    }
    toast('அறை உருவாக்க முடியவில்லை. மீண்டும் முயலுங்கள்.');
  }catch(e){ toast(errText(e)); }
  finally{ busy=false; }
}
async function joinRoom(raw){
  var name=readNick()||ls('get',K_NICK);
  if(!name){toast('முதலில் உங்கள் பெயரை உள்ளிடுங்கள்.');return;}
  var c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length<4){toast('சரியான குறியீட்டை உள்ளிடுங்கள்.');return;}
  if(busy) return; busy=true; myName=name;
  try{
    var d=await dreq('GET','rooms/'+c);
    if(d===null){ toast('இந்தக் குறியீட்டில் அறை இல்லை. குறியீட்டைச் சரிபார்க்கவும்.'); return; }
    var g=d.players&&d.players.g, tok=getToken();
    if(g&&g.tok&&g.tok!==tok){ toast('இந்த அறையில் ஏற்கெனவே இருவர் உள்ளனர்.'); return; }
    if(g) await dreq('PATCH','rooms/'+c,{'players/g/name':name});
    else await dreq('PATCH','rooms/'+c,{'players/g':{name:name,ready:false,tok:tok}});
    var fresh=await dreq('GET','rooms/'+c);
    enterRoom('g',c,fresh||d);
  }catch(e){ toast(errText(e)); }
  finally{ busy=false; }
}
async function resumeRoom(){
  var last=lastInfo(); if(!last||busy) return; busy=true;
  try{
    var d=await dreq('GET','rooms/'+last.code);
    if(d===null){ toast('முந்தைய அறை இனி இல்லை.'); ls('del',K_LAST); renderHome(); return; }
    if(last.role==='g'&&!(d.players&&d.players.g&&d.players.g.tok===getToken())){ toast('இந்த அறையில் நீங்கள் இல்லை.'); return; }
    enterRoom(last.role,last.code,d);
  }catch(e){ toast(errText(e)); }
  finally{ busy=false; }
}
async function saveDb(){
  var v=parseDb((document.getElementById('dburl')||{}).value);
  if(!v){ toast('சரியான Firebase முகவரியை ஒட்டுங்கள். https://…firebasedatabase.app அல்லது …firebaseio.com என்று இருக்க வேண்டும்.'); return; }
  var prev=ls('get',K_DB); ls('set',K_DB,v);
  try{ await dreq('GET','rooms/_ping'); toast('இணைப்பு சரி. தரவு சேவை தயார்.'); renderHome(); }
  catch(e){ ls('set',K_DB,prev); toast(errText(e)); }
}

/* ---------- ஆட்ட நகர்வுகள் ---------- */
function toggleReady(){
  if(!doc||!doc.players[other()]) return;
  var p={}; p['players/'+role+'/ready']=!(doc.players[role]&&doc.players[role].ready); write(p);
}
function confirmAnswer(){
  if(!doc||pick===null||pickQ!==doc.qNo) return;
  var q=doc.qNo, cur=doc.ans[role]; if(cur&&cur.q===q) return;
  var p={}; p['ans/'+role]={q:q,c:pick}; write(p);
}
function markNext(){
  if(!doc) return;
  var p={}; p['nx/'+role]=doc.qNo; write(p);
}
function copyText(txt,okMsg){
  function fallback(){
    var el=document.getElementById('codebox');
    if(el&&window.getSelection){ var rg=document.createRange(); rg.selectNodeContents(el); var sl=getSelection(); sl.removeAllRanges(); sl.addRange(rg); }
    toast('தேர்ந்தெடுக்கப்பட்டுள்ளது. அதை நகலெடுத்து அனுப்புங்கள்.');
  }
  try{ navigator.clipboard.writeText(txt).then(function(){toast(okMsg);},fallback); }catch(e){ fallback(); }
}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  var a=b.getAttribute('data-act');
  if(a==='create') createRoom();
  else if(a==='join') joinRoom((document.getElementById('jcode')||{}).value);
  else if(a==='resume') resumeRoom();
  else if(a==='savedb') saveDb();
  else if(a==='changedb'){ ls('del',K_DB); renderHome(); }
  else if(a==='clearhash'){ try{history.replaceState(null,'',location.href.split('#')[0]);}catch(x){} renderHome(); }
  else if(a==='copy') copyText(code,'குறியீடு நகலெடுக்கப்பட்டது.');
  else if(a==='copylink') copyText(inviteLink(),'இணைப்பு நகலெடுக்கப்பட்டது.');
  else if(a==='ready') toggleReady();
  else if(a==='opt'&&doc){ pick=+b.getAttribute('data-i'); pickQ=doc.qNo; lastHtml=''; render(); }
  else if(a==='confirm') confirmAnswer();
  else if(a==='next') markNext();
  else if(a==='leave') goHome();
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.id==='jcode'){ e.preventDefault(); joinRoom(e.target.value); }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden) return;
  if(screen==='room'){ keepAwake(); pollOnce(); }
});

/* ---------- தொடக்கம் ---------- */
document.documentElement.lang='ta';
(function(){
  var hp=hashParts();
  if(hp.db) ls('set',K_DB,hp.db);
  renderHome();
})();

})();</script>
